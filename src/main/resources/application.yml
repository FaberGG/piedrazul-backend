spring:
  application:
    name: piedrazul-backend
  profiles:
    active: dev
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/piedrazul
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: []
    allowed-origin-patterns: []
    allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allowed-headers: ["*"]
    exposed-headers: [Authorization]
    allow-credentials: false
    max-age: 3600
  rate-limiting:
    public-policies:
      - id: public-register-paciente
        method: POST
        path: /api/v1/auth/register/paciente
        capacity: 5
        window: 1m
    paciente-policies:
      - id: paciente-medicos
        method: GET
        path: /api/v1/medicos
        capacity: 60
        window: 1m
      - id: paciente-medicos-configuracion
        method: GET
        path: /api/v1/medicos/*/configuracion
        capacity: 30
        window: 1m
      - id: paciente-pacientes-id
        method: GET
        path: /api/v1/pacientes/*
        capacity: 30
        window: 1m
      - id: paciente-citas-autonomo
        method: POST
        path: /api/v1/citas/autonomo
        capacity: 10
        window: 1m
      - id: paciente-disponibilidad-primera
        method: GET
        path: /api/v1/citas/disponibilidad/primera
        capacity: 60
        window: 1m
      - id: paciente-disponibilidad-primera-global
        method: GET
        path: /api/v1/citas/disponibilidad/primera/global
        capacity: 30
        window: 1m
      - id: paciente-disponibilidad-franjas
        method: GET
        path: /api/v1/citas/disponibilidad/franjas
        capacity: 60
        window: 1m
