spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      jdbc:
        time_zone: America/Bogota
  security:
    oauth2:
      resourceserver:
        jwt:
          # Use the same canonical environment variable name as other profiles
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
  jackson:
    time-zone: ${TZ:America/Bogota}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
keycloak:
  admin:
    server-url: ${KEYCLOAK_SERVER_URL}
    realm: ${KEYCLOAK_REALM:piedrazul}
    client-id: ${KEYCLOAK_CLIENT_ID}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}

app:
  cors:
    # TODO: definir dominios frontend reales antes de desplegar.
    # Ejemplo: ["https://app.piedrazul.com", "https://admin.piedrazul.com"]
    allowed-origins: []
  rate-limiting:
    public-policies:
      - id: public-register-paciente
        method: POST
        path: /api/v1/auth/register/paciente
        capacity: 5
        window: 1m
    paciente-policies:
      - id: paciente-medicos
        method: GET
        path: /api/v1/medicos
        capacity: 60
        window: 1m
      - id: paciente-medicos-configuracion
        method: GET
        path: /api/v1/medicos/*/configuracion
        capacity: 30
        window: 1m
      - id: paciente-pacientes-id
        method: GET
        path: /api/v1/pacientes/*
        capacity: 30
        window: 1m
      - id: paciente-citas-autonomo
        method: POST
        path: /api/v1/citas/autonomo
        capacity: 10
        window: 1m
      - id: paciente-disponibilidad-primera
        method: GET
        path: /api/v1/citas/disponibilidad/primera
        capacity: 60
        window: 1m
      - id: paciente-disponibilidad-primera-global
        method: GET
        path: /api/v1/citas/disponibilidad/primera/global
        capacity: 30
        window: 1m
      - id: paciente-disponibilidad-franjas
        method: GET
        path: /api/v1/citas/disponibilidad/franjas
        capacity: 60
        window: 1m
