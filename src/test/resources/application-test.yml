spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/piedrazul_test
    username: test_user
    password: test_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ""
          jwk-set-uri: ""

  # Desactiva el mail para no necesitar SMTP en tests
  mail:
    host: localhost
    port: 25
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

keycloak:
  admin:
    server-url: http://localhost:8080
    realm: piedrazul
    client-id: test-client
    client-secret: test-secret

app:
  cors:
    allowed-origin-patterns: ["*"]
  rate-limiting:
    public-policies: []
    paciente-policies: []

logging:
  level:
    com.piedrazul: DEBUG