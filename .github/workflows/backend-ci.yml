name: Backend CI & Registry (Prod)

on:
  push:
    branches: [ "prod" ]
  pull_request:
    branches: [ "prod" ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: piedrazul_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Run tests
        run: ./mvnw -B clean test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/piedrazul_test
          SPRING_DATASOURCE_USERNAME: test_user
          SPRING_DATASOURCE_PASSWORD: test_password
          SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/piedrazul

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/piedrazul-backend:latest
            ghcr.io/${{ env.REPO }}/piedrazul-backend:${{ github.sha }}
  # ==========================================
  # FASE 3: DESPLIEGUE CONTINUO VÍA SSH (CD)
  # ==========================================
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build-and-push # Espera obligatoriamente a que la imagen esté creada

    steps:
      - name: Ejecutar comandos de despliegue en el servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            # 1. Iniciar sesión en el registro de GitHub desde Azure
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 2. Navegar a la carpeta donde tienes tu docker-compose.prod.yml
            # IMPORTANTE: Cambia esta ruta por la carpeta real en tu servidor
            cd ~/piedrazul
            
            # 3. Descargar la versión más reciente de la imagen
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull backend
            
            # 4. Recrear el contenedor sin interrumpir a los demás servicios
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-deps backend
            
            # 5. Limpieza automática: borrar imágenes Docker viejas para no llenar el disco
            docker image prune -af