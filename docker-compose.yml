
services:

  postgres:
    image: postgres:15-alpine
    container_name: piedrazul_db
    environment:
      # PostgreSQL del stack Docker
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - piedrazul_data:/var/lib/postgresql/data
      # Script que crea la DB de keycloak al iniciar por primera vez
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: piedrazul_pgadmin
    environment:
      # Credenciales para la UI de administración
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: piedrazul_keycloak
    # start-dev: modo desarrollo (no TLS)
    # --import-realm: importa automáticamente los JSON de /opt/keycloak/data/import
    # --db: usa PostgreSQL como backend
    command: start-dev --import-realm --db=postgres
    environment:
      # Conexión de Keycloak a PostgreSQL
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # Host y salud de Keycloak
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: ${KC_HOSTNAME:-keycloak}
      KC_HOSTNAME_PORT: ${KC_HOSTNAME_PORT:-8080}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-false}
      KC_HOSTNAME_STRICT_HTTPS: ${KC_HOSTNAME_STRICT_HTTPS:-false}
      KC_HEALTH_ENABLED: ${KC_HEALTH_ENABLED:-true}
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080; echo -e \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: piedrazul_backend
    environment:
      # Spring Boot dentro de Docker Compose prioriza los servicios del stack
      # y sobrescribe los valores de `.env.dev` para no usar localhost dentro del contenedor.
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/piedrazul_dev
      SPRING_DATASOURCE_USERNAME: piedrazul_user
      SPRING_DATASOURCE_PASSWORD: piedrazul_pass
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/piedrazul
      # Configuración de Keycloak consumida por la app
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: piedrazul
      KEYCLOAK_CLIENT_ID: piedrazul-backend
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: on-failure

volumes:
  piedrazul_data: