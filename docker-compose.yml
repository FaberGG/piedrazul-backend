version: "3.9"

services:

  postgres:
    image: postgres:15-alpine
    container_name: piedrazul_db
    env_file:
      - ./.env.dev
    ports:
      - "5433:5432"
    volumes:
      - piedrazul_data:/var/lib/postgresql/data
      # Script que crea la DB de keycloak al iniciar por primera vez
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: piedrazul_pgadmin
    env_file:
      - ./.env.dev
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: piedrazul_keycloak
    # start-dev: modo desarrollo (no TLS)
    # --import-realm: importa automáticamente los JSON de /opt/keycloak/data/import
    # --db: usa PostgreSQL como backend
    command: start-dev --import-realm --db=postgres
    env_file:
      - ./.env.dev
    environment:
      # Conexión a PostgreSQL - misma instancia, distinta DB
      KC_DB: postgres
      # Puerto interno
      KC_HTTP_PORT: 8080
      # Hostname (para dev sin TLS)
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      # Habilita endpoint de salud para readiness
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080; echo -e \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: piedrazul_backend
    env_file:
      - ./.env.dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      OAUTH2_ISSUER_URI: http://keycloak:8080/realms/piedrazul
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/piedrazul
      KEYCLOAK_SERVER_URL: http://keycloak:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: on-failure

volumes:
  piedrazul_data: